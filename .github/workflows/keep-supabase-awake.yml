name: keep-supabase-awake

# Pings the Supabase project once a day so the free-tier project
# never reaches the 7-day inactivity pause. Prevention only:
# an already-paused project must be resumed from the dashboard.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://yoyvpgbahhnqbuhcarnh.supabase.co/rest/v1/" > /dev/null
          echo "Supabase ping OK at $(date -u)"
