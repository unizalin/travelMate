name: keep-supabase-awake

# Pings the Supabase project once a day so the free-tier project
# never reaches the 7-day inactivity pause. Prevention only:
# an already-paused project must be resumed from the dashboard.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "https://yoyvpgbahhnqbuhcarnh.supabase.co/rest/v1/trips?select=id&limit=0")
          echo "Supabase HTTP status: $status"
          test "$status" = "200"
          echo "Supabase ping OK at $(date -u)"
